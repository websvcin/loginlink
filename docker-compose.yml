services:
  loginlink:
    image: websvcin/loginlink:latest
    container_name: loginlink
    ports:
      - "5000:5000"
      - "5443:5443"
    volumes:
      - ./App_Data:/app/App_Data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
